name: solar
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python version
  - python=3.10
  
  # Core dependencies
  - django>=4.2.0
  - networkx>=3.1
  - python-dotenv>=1.0.0
  
  # Code quality tools
  - black>=23.0.0
  - flake8>=6.0.0
  - isort>=5.12.0
  
  # Testing tools
  - pytest>=7.3.1
  - pytest-django>=4.5.2
  - pytest-timeout>=2.1.0
  
  # Package management
  - pip
  
  # Pip-only packages
  - pip:
    - openai>=1.3.0