{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Audio Lab</title>
  <link rel="stylesheet" type="text/css" href="{% static 'universe/css/style.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'universe/css/audio_lab.css' %}">
</head>
<body>
  <div class="audio-lab">
    <h2>Audio Lab (Dev Tool)</h2>

    <div class="row">
      <label class="block">
        Text
        <textarea id="labText" rows="3">Sphinx of black quartz, judge my vow.</textarea>
      </label>
    </div>

    <div class="row">
      <div class="mode">
        <div class="label">Mode</div>
        <label><input type="radio" name="mode" value="modem" checked /> Modem</label>
        <label><input type="radio" name="mode" value="tts" /> TTS (preset voice clip)</label>
      </div>

      <div class="toggles">
        <div class="label">Toggles</div>
        <label><input type="checkbox" id="includeQuindar" checked /> Quindar before &amp; after</label>
        <label><input type="checkbox" id="includeStatic" checked /> Static bed</label>
      </div>
    </div>

    <div class="row grid">
      <div class="panel">
        <h3>Modem</h3>
        <label>Gain <input id="modemGain" type="range" min="0" max="1" step="0.01" value="0.80" /></label>
        <label>Mark Hz <input id="markFreq" type="number" min="200" max="4000" step="10" value="1200" /></label>
        <label>Space Hz <input id="spaceFreq" type="number" min="200" max="4000" step="10" value="2200" /></label>
        <label>Warble rate Hz <input id="wowRate" type="range" min="0" max="6" step="0.1" value="0.0" /></label>
        <label>Warble depth Hz <input id="wowDepth" type="range" min="0" max="120" step="1" value="0.0" /></label>
        <label>Carrier Hz <input id="carrierFreq" type="number" min="200" max="4000" step="10" value="1800" /></label>
        <label>Carrier gain <input id="carrierGain" type="range" min="0" max="1" step="0.01" value="0.15" /></label>
        <label>Baud <input id="baudRate" type="number" min="300" max="2400" step="100" value="1200" /></label>
      </div>

      <div class="panel">
        <h3>Static / Room Tone</h3>
        <label>Gain <input id="staticGain" type="range" min="0" max="0.5" step="0.005" value="0.08" /></label>
        <label>Intensity <input id="staticIntensity" type="range" min="0" max="2" step="0.01" value="0.60" /></label>
        <label>Highpass Hz <input id="staticHighpass" type="number" min="0" max="2000" step="10" value="80" /></label>
        <label>Lowpass Hz <input id="staticLowpass" type="number" min="200" max="12000" step="100" value="5000" /></label>

        <label><input type="checkbox" id="includeRumble" /> Engine rumble</label>
        <label>Rumble Hz <input id="rumbleFreq" type="number" min="20" max="200" step="1" value="55" /></label>
        <label>Rumble gain <input id="rumbleGain" type="range" min="0" max="0.3" step="0.005" value="0.05" /></label>

        <label><input type="checkbox" id="includeEcho" /> Reverb/Echo (simple)</label>
        <label>Delay ms <input id="echoDelay" type="number" min="10" max="500" step="5" value="90" /></label>
        <label>Decay <input id="echoDecay" type="range" min="0" max="0.95" step="0.01" value="0.25" /></label>
        <label>Wet mix <input id="echoWet" type="range" min="0" max="1" step="0.01" value="0.12" /></label>
      </div>

      <div class="panel">
        <h3>TTS (preset voice clip)</h3>
        <label>Preset <select disabled><option>Sample voice clip</option></select></label>
        <label>TTS gain <input id="ttsGain" type="range" min="0" max="2" step="0.01" value="1.00" /></label>
        <div class="hint">Plays the bundled sample clip; text is ignored until real TTS is integrated.</div>
      </div>
    </div>

    <div class="row controls">
      <button id="playBtn">Play</button>
      <button id="stopBtn">Stop</button>
      <button id="settingsBtn">Show settings</button>
      <button id="exportBtn">Export as…</button>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content">
      <div class="modal-header">
        <div id="settingsTitle" class="modal-title">Current settings (JSON)</div>
        <button id="closeSettingsBtn" class="modal-close">Close</button>
      </div>
      <label class="block">
        Profile name (for export filename)
        <input id="profileName" type="text" value="small_ship" />
      </label>
      <textarea id="settingsText" rows="14" readonly></textarea>
      <div class="modal-actions">
        <button id="copySettingsBtn">Copy JSON</button>
        <button id="downloadSettingsBtn">Download JSON</button>
      </div>
    </div>
  </div>

  <script>
    const AUDIO_LAB_RENDER_URL = '{% url "audio_lab_render" %}';
  </script>
  <script src="{% static 'universe/js/audio_lab.js' %}"></script>
</body>
</html>
