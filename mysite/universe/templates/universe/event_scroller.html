{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dialogue Event Scroller</title>
    <link rel="stylesheet" type="text/css" href="{% static 'universe/css/event_scroller.css' %}">
</head>
<body>
    <div class="event-scroller-container" id="eventContainer">
        <div class="event-log" id="eventLog">
            <!-- Events will be appended here -->
        </div>
    </div>

    <script>
        // Configuration
        const POLL_INTERVAL = 2000; // Poll every 2 seconds
        // Use absolute URL to ensure it works from iframe
        const API_ENDPOINT = '{% url "event_feed" %}';
        
        // State
        let lastEventId = null;
        let isPolling = true;
        
        // DOM elements
        const eventLog = document.getElementById('eventLog');
        const eventContainer = document.getElementById('eventContainer');
        
        /**
         * Format timestamp as HH:MM:SS
         */
        function formatTimestamp(timestamp) {
            const hours = Math.floor(timestamp / 3600);
            const minutes = Math.floor((timestamp % 3600) / 60);
            const seconds = Math.floor(timestamp % 60);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        /**
         * Type out text character by character (like a serial/modem feed)
         */
        function typeText(element, text, callback) {
            let index = 0;
            
            function typeChar() {
                if (index < text.length) {
                    const char = text[index];
                    element.textContent += char;
                    
                    // Variable delay: faster for spaces, slower for punctuation
                    let delay = 8; // Default 8ms for regular characters
                    if (char === ' ') {
                        delay = 2; // Quick for spaces
                    } else if (char.match(/[.,!?;:]/)) {
                        delay = 15; // Slight pause for punctuation
                    } else if (char === '\n') {
                        delay = 10; // Brief pause for newlines
                    }
                    
                    index++;
                    setTimeout(typeChar, delay);
                } else {
                    if (callback) callback();
                }
            }
            
            typeChar();
        }
        
        /**
         * Create an event line element with trickle effect
         */
        function createEventLine(event) {
            const line = document.createElement('div');
            line.className = 'event-line';
            
            // Timestamp (appears immediately)
            const timestamp = document.createElement('span');
            timestamp.className = 'event-timestamp';
            timestamp.textContent = `[${formatTimestamp(event.timestamp)}] `;
            line.appendChild(timestamp);
            
            // Speaker name (types out)
            const speakerContainer = document.createElement('span');
            speakerContainer.className = 'event-speaker';
            line.appendChild(speakerContainer);
            
            // Type speaker name, then the message text
            typeText(speakerContainer, `${event.actor_name}: `, () => {
                // After speaker name is typed, type the message text
                const textContainer = document.createElement('span');
                textContainer.className = 'event-text';
                line.appendChild(textContainer);
                typeText(textContainer, event.text, () => {
                    // Auto-scroll to bottom after message completes
                    eventContainer.scrollTop = eventContainer.scrollHeight;
                });
            });
            
            return line;
        }
        
        /**
         * Append events to the log with trickle effect
         */
        function appendEvents(events) {
            events.forEach(event => {
                const line = createEventLine(event);
                eventLog.appendChild(line);
            });
        }
        
        /**
         * Fetch new events from the API
         */
        async function fetchEvents() {
            if (!isPolling) return;
            
            try {
                const url = lastEventId 
                    ? `${API_ENDPOINT}?after_id=${lastEventId}&limit=100`
                    : `${API_ENDPOINT}?limit=100`;
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.events && data.events.length > 0) {
                    appendEvents(data.events);
                    // Update to the latest ID from the response
                    lastEventId = data.latest_id;
                }
            } catch (error) {
                console.error('Error fetching events:', error);
            }
        }
        
        /**
         * Start polling for events
         */
        function startPolling() {
            // Initial fetch
            fetchEvents();
            
            // Set up interval
            setInterval(fetchEvents, POLL_INTERVAL);
        }
        
        /**
         * Handle messages from parent window (for clear terminal, etc.)
         */
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'clear') {
                // Clear all events from the display (like a terminal clear command)
                // Keep lastEventId so we don't re-fetch old events
                eventLog.innerHTML = '';
                // Reset scroll position
                eventContainer.scrollTop = 0;
            }
        });
        
        // Start polling when page loads
        document.addEventListener('DOMContentLoaded', startPolling);
    </script>
</body>
</html>
