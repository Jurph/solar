{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Universe Browser</title>
    <link rel="stylesheet" type="text/css" href="{% static 'universe/css/style.css' %}">
</head>
<body>
    {% block content %}
    {% endblock %}

    <script>
    function toggleNode(button) {
        const content = button.parentElement.querySelector('.tree-content');
        if (content.style.display === 'none' || content.style.display === '') {
            content.style.display = 'block';
            button.textContent = '-';
        } else {
            content.style.display = 'none';
            button.textContent = '+';
        }
    }
    </script>
</body>
</html>
