{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dialogue Event Scroller - Control Panel</title>
    <link rel="stylesheet" type="text/css" href="{% static 'universe/css/event_scroller_wrapper.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'universe/css/event_scroller.css' %}">
</head>
<body>
    <div class="control-panel">
        <div class="simulation-status">
            <span class="status-label">Simulation Time:</span>
            <span id="simTimeDisplay" class="status-value">--:--:--</span>
            <span class="status-divider">|</span>
            <span class="status-label">Scale:</span>
            <span id="timeScaleDisplay" class="status-value">1x</span>
            <span class="status-divider">|</span>
            <span class="status-label">LLM:</span>
            <span id="llmStatusDisplay" class="status-value" title="LLM server status">🔴</span>
            <span class="status-divider">|</span>
            <span class="status-label">TTS:</span>
            <span id="ttsStatusDisplay" class="status-value" title="TTS audio worker status">🔴</span>
            <span class="status-divider">|</span>
            <span class="status-label">Event Queue:</span>
            <span id="pendingEventsDisplay" class="status-value pending-count">0 pending</span>
            <span class="status-divider">|</span>
            <span class="status-label">Next in:</span>
            <span id="nextEventDisplay" class="status-value next-event-time">--</span>
        </div>
        <div class="controls">
            <button id="spawnCargoShipButton" class="control-button primary">Spawn Cargo Ship</button>
            <button id="spawnNavsatButton" class="control-button primary">Spawn Navsat</button>
            <button id="skipToNextButton" class="control-button">⏭ Skip to Next</button>
            <button id="clearEventsButton" class="control-button danger">Clear All Events</button>
            <button id="clearDisplayButton" class="control-button">Clear Display</button>
            <div class="time-scale-controls">
                <span>Time Scale:</span>
                <button class="scale-btn" data-scale="1">1x</button>
                <button class="scale-btn" data-scale="60">60x</button>
                <button class="scale-btn" data-scale="600">600x</button>
                <button class="scale-btn" data-scale="3600">3600x</button>
            </div>
            <div class="audio-controls">
                <span>Audio:</span>
                <button id="audioEnableButton" class="control-button">Audio: Muted</button>
                <label class="audio-volume">
                    Vol
                    <input id="audioVolume" type="range" min="0" max="1" step="0.01" value="0.2">
                </label>
            </div>
        </div>
    </div>
    
    <div class="event-scroller-container" id="eventContainer">
        <div class="event-log" id="eventLog">
            <!-- Events will be appended here -->
        </div>
    </div>

    <script src="{% static 'universe/js/audio_player.js' %}"></script>
    <script>
        // URL endpoints — injected by Django template (referenced by event_scroller.js)
        const API_ENDPOINT = '{% url "event_feed" %}';
        const STATUS_ENDPOINT = '{% url "simulation_status" %}';
        const HEALTH_ENDPOINT = '{% url "health_check" %}';
        const TIME_SCALE_ENDPOINT = '{% url "set_time_scale" %}';
        const SKIP_TO_NEXT_ENDPOINT = '{% url "skip_to_next_event" %}';
        const SPAWN_MISSION_ENDPOINT = '{% url "spawn_mission" %}';
        const CLEAR_EVENTS_ENDPOINT = '{% url "clear_all_events" %}';
        const AUDIO_PRESET_URL_TEMPLATE = '{% url "audio_preset" preset="__PRESET__" %}';
    </script>
    <script src="{% static 'universe/js/event_scroller.js' %}"></script>
</body>
</html>
