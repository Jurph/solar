version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    parallelism: 4

    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-v3-{{ checksum "pyproject.toml" }}
            - venv-v3-

      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -e ".[dev,ci]"

      - save_cache:
          key: venv-v3-{{ checksum "pyproject.toml" }}
          paths:
            - venv

      - run:
          name: Run tests with coverage
          command: |
            source venv/bin/activate
            export DJANGO_SETTINGS_MODULE=mysite.settings
            TESTS=$(circleci tests glob "tests/test_*.py" | \
                    circleci tests split --split-by=timings)
            pytest $TESTS -m "not slow" \
              --cov=mysite/universe \
              --cov-report=xml:coverage.xml \
              --cov-report=term \
              --junitxml=test-results/junit.xml

      - run:
          name: Upload partial coverage to Codecov
          command: |
            source venv/bin/activate
            codecovcli upload-process \
              --token=$CODECOV_TOKEN \
              --flag parallel \
              --plugin pycoverage \
              --coverage-files-search-root-folder .

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage.xml

  dependency-audit:
    docker:
      - image: cimg/python:3.10

    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-v3-{{ checksum "pyproject.toml" }}
            - venv-v3-

      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -e .[dev]

      - save_cache:
          key: venv-v3-{{ checksum "pyproject.toml" }}
          paths:
            - venv

      - run:
          name: Audit declared dependencies
          command: |
            source venv/bin/activate
            python scripts/audit_dependencies.py

  notify-codecov:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Notify Codecov to merge parallel uploads
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov send-notifications --token=$CODECOV_TOKEN

workflows:
  test-workflow:
    jobs:
      - test
      - notify-codecov:
          requires:
            - test
  daily-dependency-audit:
    triggers:
      - schedule:
          cron: "0 9 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - dependency-audit
