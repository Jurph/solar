version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    parallelism: 4

    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-v1-{{ checksum "requirements.txt" }}
            - venv-v1-

      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            venv/bin/pip install codecov-cli

      - save_cache:
          key: venv-v1-{{ checksum "requirements.txt" }}
          paths:
            - venv

      - run:
          name: Run tests with coverage
          command: |
            source venv/bin/activate
            export DJANGO_SETTINGS_MODULE=mysite.settings
            TESTS=$(circleci tests glob "tests/test_*.py" | \
                    circleci tests split --split-by=timings)
            pytest $TESTS -m "not slow" \
              --cov=mysite/universe \
              --cov-report=xml:coverage.xml \
              --cov-report=term \
              --junitxml=test-results/junit.xml

      - run:
          name: Upload partial coverage to Codecov
          command: |
            source venv/bin/activate
            codecovCLI upload-process \
              --token=$CODECOV_TOKEN \
              --flag parallel \
              --plugin pycoverage \
              --coverage-files-search-root-folder .

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage.xml

  # TODO: this job spins up a full cimg/python:3.10 container just to run one
  # CLI command. Consider switching to cimg/base and using the Codecov orb
  # (https://circleci.com/developer/orbs/orb/codecov/codecov) to skip the
  # pip install entirely and shave ~60s off this job's cold start.
  notify-codecov:
    docker:
      - image: cimg/python:3.10

    steps:
      - run:
          name: Install codecov-cli
          command: pip install codecov-cli

      - run:
          name: Notify Codecov to merge parallel uploads
          command: |
            export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
            codecovCLI send-notifications --token=$CODECOV_TOKEN

workflows:
  test-workflow:
    jobs:
      - test
      - notify-codecov:
          requires:
            - test
