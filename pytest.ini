[pytest]
DJANGO_SETTINGS_MODULE = mysite.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Optionally, reuse the database to speed up tests:
addopts = --reuse-db

# For some reason, pytest thinks this file exists but it doesn't. 
norecursedirs = mysite/universe/tests/test_text_service.py

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Set default timeout for tests (especially important for LLM-based tests)
timeout = 60

# Output verbose information during test runs
verbose = 2

# Disable warnings during test execution
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
