[pytest]
DJANGO_SETTINGS_MODULE = mysite.settings
pythonpath = .
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Optionally, reuse the database to speed up tests:
# addopts = --reuse-db  # Commented out - requires pytest-django

# For some reason, pytest thinks this file exists but it doesn't. 
norecursedirs = mysite/universe/tests/test_text_service.py

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    external: tests that depend on external local services, models, GPU state, or host environment
    llm: tests that exercise a real LLM endpoint instead of project-local logic
    ollama: tests that require or probe a local Ollama-compatible endpoint
    tts: tests that require local text-to-speech model dependencies or generated audio
    performance: benchmark or timing tests whose result depends on host performance

# Disable warnings during test execution
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
